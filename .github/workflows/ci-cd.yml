name: Flask CI/CD

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify app version
        run: |
          echo "Git commit:"
          git rev-parse HEAD
          echo "app.py content:"
          cat app.py

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build --no-cache -t 362245/flask-cicd:latest .

      - name: Verify Docker image
        run: |
          docker run --rm 362245/flask-cicd:latest cat /app/app.py

      - name: Push Docker image
        run: |
          docker push 362245/flask-cicd:latest

  deploy-to-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Pulling latest Docker image..."
            docker pull 362245/flask-cicd:latest

            echo "Removing old container..."
            docker rm -f flask-cicd-app || true

            echo "Starting new container..."
            docker run -d \
              --name flask-cicd-app \
              -p 5000:5000 \
              362245/flask-cicd:latest

            echo "Checking container..."
            docker ps --filter "name=flask-cicd-app"

            echo "Testing Flask application..."
            sleep 3
            curl -f http://localhost:5000
