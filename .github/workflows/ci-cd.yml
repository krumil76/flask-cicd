# Flask CI/CD GitHub Actions
name: Flask CI/CD

on:
  push:
    branches:
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker image
        run: docker build -t 362245/flask-cicd:latest .

      - name: Push Docker image
        run: docker push 362245/flask-cicd:latest

  deploy-to-ec2:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull 362245/flask-cicd:latest
            docker stop flask-cicd-app || true
            docker rm flask-cicd-app || true
            docker run -d \
              --name flask-cicd-app \
              -p 5000:5000 \
              362245/flask-cicd:latest

